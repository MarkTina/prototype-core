<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <rect width="960" height="600" fill="#e9eff8"/>
  <rect x="48" y="48" width="864" height="504" rx="18" fill="#fff" stroke="#aebed4" stroke-width="2"/>
  <rect x="48" y="48" width="864" height="68" rx="18" fill="#172a46"/>
  <rect x="48" y="92" width="864" height="24" fill="#172a46"/>
  <g font-family="Microsoft YaHei, sans-serif">
    <text x="80" y="91" font-size="22" fill="#fff" font-weight="700">示例项目 / 任务列表</text>
    <text x="880" y="91" font-size="15" text-anchor="end" fill="#c6d8ef">桌面端 · 实际表现</text>
    <text x="88" y="177" font-size="32" font-weight="700" fill="#172a46">我的任务</text>
    <text x="88" y="211" font-size="17" fill="#53647b">刷新后，状态筛选恢复成了“全部状态”。</text>
    <rect x="88" y="238" width="190" height="56" rx="8" fill="#fff3ef" stroke="#b74438" stroke-width="3"/>
