    <text x="296" y="273" font-size="17" fill="#8c2f27">此处应保留“仅待处理”</text>
    <rect x="88" y="325" width="784" height="177" rx="8" fill="#f5f7fa" stroke="#d8e0eb"/>
    <text x="108" y="357" font-size="16" fill="#53647b">任务名称</text>
    <text x="704" y="357" font-size="16" fill="#53647b">状态</text>
    <line x1="88" y1="370" x2="872" y2="370" stroke="#d8e0eb"/>
    <text x="108" y="406" font-size="20" fill="#172a46">更新空状态提示</text>
    <text x="704" y="406" font-size="18" fill="#8c2f27">待处理</text>
    <line x1="88" y1="426" x2="872" y2="426" stroke="#d8e0eb"/>
    <text x="108" y="465" font-size="20" fill="#172a46">核对首页间距</text>
    <text x="704" y="465" font-size="18" fill="#235c49">已完成</text>
  </g>
</svg>
